<!DOCTYPE html>
<html lang="en" dir="ltr" id="html-root">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart City Traffic — Riyadh</title>
  <style>
    :root {
      --green : #22c55e;
      --amber : #f59e0b;
      --red   : #ef4444;
      --blue  : #3b82f6;
      --bg    : #0f172a;
      --card  : #1e293b;
      --text  : #f1f5f9;
      --muted : #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; padding: 1.5rem;
    }
    header {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 1.5rem;
      flex-wrap: wrap; gap: 0.75rem;
    }
    h1 { font-size: 1.4rem; font-weight: 700; }
    .lang-toggle {
      background: var(--card); border: 1px solid #334155;
      color: var(--text); padding: 0.4rem 1rem;
      border-radius: 0.5rem; cursor: pointer; font-size: 0.9rem;
    }
    .advisory-banner {
      background: #7c2d12; border-left: 4px solid var(--red);
      border-radius: 0.5rem; padding: 0.75rem 1rem;
      margin-bottom: 1.25rem; display: none;
    }
    .advisory-banner.visible { display: block; }
    .section-title {
      font-size: 0.85rem; font-weight: 600;
      color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.05em; margin-bottom: 0.75rem;
    }
    .zones-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.75rem; margin-bottom: 1.5rem;
    }
    .zone-card {
      background: var(--card); border-radius: 0.75rem;
      padding: 1rem; text-align: center;
      border: 2px solid transparent;
    }
    .zone-card .zone-name { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.4rem; }
    .zone-card .zone-status { font-size: 1.1rem; font-weight: 700; }
    .zone-card .zone-score { font-size: 0.75rem; color: var(--muted); margin-top: 0.3rem; }
    .status-Normal   { border-color: var(--green); color: var(--green); }
    .status-Slow     { border-color: var(--amber); color: var(--amber); }
    .status-Congested{ border-color: var(--red);   color: var(--red);   }
    .status-Incident { border-color: var(--red);   color: var(--red); background: #1a0a0a; }
    .incidents-list { margin-bottom: 1.5rem; }
    .incident-row {
      background: var(--card); border-radius: 0.5rem;
      padding: 0.75rem 1rem; margin-bottom: 0.5rem;
      display: flex; justify-content: space-between;
      align-items: center; flex-wrap: wrap; gap: 0.5rem;
    }
    .badge {
      font-size: 0.75rem; font-weight: 600;
      padding: 0.2rem 0.6rem; border-radius: 9999px;
    }
    .badge-Critical { background: #7f1d1d; color: #fca5a5; }
    .badge-Major    { background: #7c2d12; color: #fdba74; }
    .badge-Moderate { background: #713f12; color: #fde68a; }
    .badge-Minor    { background: #1e3a5f; color: #93c5fd; }
    .no-data { color: var(--muted); font-size: 0.9rem; padding: 0.5rem 0; }
    footer {
      margin-top: 2rem; color: var(--muted);
      font-size: 0.75rem; text-align: center;
    }
    .refresh-note { color: var(--muted); font-size: 0.75rem; margin-bottom: 1rem; }

        /* Journey Planner */
    .journey-form {
      display: flex; gap: 0.5rem; flex-wrap: wrap;
      align-items: center; margin-bottom: 1rem;
    }
    .journey-form label {
      display: flex; gap: 0.4rem; align-items: center;
      font-size: 0.85rem; color: var(--muted);
    }
    .journey-select, .journey-btn {
      background: var(--card); border: 1px solid #334155;
      color: var(--text); padding: 0.45rem 0.75rem;
      border-radius: 0.5rem; font-size: 0.9rem;
    }
    .journey-btn {
      cursor: pointer; background: var(--blue); border-color: var(--blue);
      font-weight: 600; color: white;
    }
    .journey-btn:hover { opacity: 0.88; }
    .journey-leg {
      background: var(--card); border-radius: 0.5rem;
      padding: 0.65rem 1rem; margin-bottom: 0.4rem;
      display: flex; justify-content: space-between;
      align-items: center; flex-wrap: wrap; gap: 0.5rem;
    }
    .journey-leg-recommended {
      border-left: 3px solid var(--green);
    }
    .precision-badge {
      font-size: 0.7rem; font-weight: 600;
      padding: 0.15rem 0.5rem; border-radius: 9999px;
      background: #713f12; color: #fde68a;
      display: inline-block; margin-top: 0.3rem;
    }
    .journey-assumption {
      font-size: 0.75rem; color: var(--muted);
      margin-top: 0.35rem; font-style: italic;
      line-height: 1.4;
    }

    /* RTL overrides for journey planner */
    [dir="rtl"] .journey-leg-recommended {
      border-left: none; border-right: 3px solid var(--green);
    }

    /* RTL overrides */
    [dir="rtl"] .advisory-banner { border-left: none; border-right: 4px solid var(--red); }
    [dir="rtl"] header { flex-direction: row-reverse; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">🚦 Riyadh Traffic — Live Status</h1>
    <button class="lang-toggle" onclick="toggleLang()" id="lang-btn">عربي</button>
  </header>

  <div class="advisory-banner" id="advisory-banner">
    <strong id="advisory-title">⚠ Travel Advisory</strong>
    <p id="advisory-text"></p>
  </div>

  <p class="refresh-note" id="refresh-note">Auto-refreshes every 60 seconds</p>

  <p class="section-title" id="zones-label">Zone Status</p>
  <div class="zones-grid" id="zones-grid">
    <p class="no-data">Loading...</p>
  </div>

  <p class="section-title" id="incidents-label">Active Incidents</p>
  <div class="incidents-list" id="incidents-list">
    <p class="no-data">Loading...</p>
  </div>

  <!-- Parking Guidance -->
<div style="margin-top: 1.5rem;">
  <p class="section-title" id="parking-label">Available Parking</p>
  <div id="parking-guidance-portal">
    <p class="no-data">Loading…</p>
  </div>
</div>

  <!-- Journey Planner (PROMPT 164) -->
  <div style="margin-top: 1.5rem;">
    <p class="section-title" id="journey-label">Plan a Journey</p>
    <div class="journey-form">
      <label>
        <span id="journey-from-label">From</span>
        <select id="journey-from" class="journey-select">
          <option>Zone_1</option><option>Zone_2</option>
          <option>Zone_3</option><option>Zone_4</option>
          <option>Zone_5</option>
        </select>
      </label>
      <label>
        <span id="journey-to-label">To</span>
        <select id="journey-to" class="journey-select">
          <option>Zone_5</option><option>Zone_4</option>
          <option>Zone_3</option><option>Zone_2</option>
          <option>Zone_1</option>
        </select>
      </label>
      <button class="journey-btn" onclick="loadJourneyPlan()" id="journey-btn">Plan Journey</button>
    </div>
    <div id="journey-result"></div>
  </div>


  <footer id="footer-note">
    Official City of Riyadh Traffic Intelligence System &mdash; Vision 2030
  </footer>

  <noscript>
    <p style="color:#f59e0b;margin-top:1rem;">
      JavaScript is disabled. Please enable it for live data, or visit
      <a href="/public/traffic-status" style="color:#60a5fa">/public/traffic-status</a>
      and <a href="/public/incidents" style="color:#60a5fa">/public/incidents</a> directly.
    </p>
  </noscript>

  <script>
    const LABELS = {
      en: {
        title        : "🚦 Riyadh Traffic — Live Status",
        zonesLabel   : "Zone Status",
        incidentsLabel: "Active Incidents",
        noIncidents  : "No active incidents.",
        clearance    : "Clearance",
        mins         : "min",
        refreshNote  : "Auto-refreshes every 60 seconds",
        advisoryTitle: "⚠ Travel Advisory",
        footerNote   : "Official City of Riyadh Traffic Intelligence System — Vision 2030",
        langBtn      : "عربي",
        statuses     : { Normal:"Normal", Slow:"Slow", Congested:"Congested", Incident:"Incident" },
        journeyLabel : "Plan a Journey",
        journeyFrom  : "From",
        journeyTo    : "To",
        journeyBtn   : "Plan Journey",
        journeyApprox: "Approximate",
        journeyRecommended: "Fastest",
        journeyMins  : "min",
        journeyNoResult: "Select origin and destination to plan.",
        journeyError : "Could not plan journey.",
        journeyPrecisionNote: "Approximate legs use fixed assumptions, not live schedules.",
      },
      ar: {
        title        : "🚦 حركة الرياض — الحالة الآنية",
        zonesLabel   : "حالة المناطق",
        incidentsLabel: "الحوادث النشطة",
        noIncidents  : "لا توجد حوادث نشطة.",
        clearance    : "وقت الإخلاء",
        mins         : "دقيقة",
        refreshNote  : "يتجدد تلقائياً كل 60 ثانية",
        advisoryTitle: "⚠ تنبيه السفر",
        footerNote   : "نظام ذكاء المرور الرسمي لمدينة الرياض — رؤية 2030",
        langBtn      : "English",
                statuses     : { Normal:"طبيعي", Slow:"بطيء", Congested:"مزدحم", Incident:"حادث" },
        journeyLabel : "خطط لرحلتك",
        journeyFrom  : "من",
        journeyTo    : "إلى",
        journeyBtn   : "خطط الرحلة",
        journeyApprox: "تقريبي",
        journeyRecommended: "الأسرع",
        journeyMins  : "دقيقة",
        journeyNoResult: "اختر نقطة البداية والوجهة للتخطيط.",
        journeyError : "لم نتمكن من تخطيط الرحلة.",
        journeyPrecisionNote: "الأرجل التقريبية تستخدم افتراضات ثابتة، ليست جداول حية.",
      },
    };

    let lang = "en";

    function toggleLang() {
      lang = lang === "en" ? "ar" : "en";
      const html = document.getElementById("html-root");
      html.setAttribute("lang", lang);
      html.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
      applyLabels();
      loadData();
      if (lastJourneyParams) {
        loadJourneyPlan();
      }
    }

    function applyLabels() {
      const L = LABELS[lang];
      document.getElementById("title").textContent          = L.title;
      document.getElementById("zones-label").textContent    = L.zonesLabel;
      document.getElementById("incidents-label").textContent= L.incidentsLabel;
      document.getElementById("refresh-note").textContent   = L.refreshNote;
      document.getElementById("lang-btn").textContent       = L.langBtn;
      document.getElementById("footer-note").textContent    = L.footerNote;
      document.getElementById("advisory-title").textContent = L.advisoryTitle;
      document.getElementById("parking-label").textContent = L.parkingLabel || "Available Parking";
      document.getElementById("journey-label").textContent = L.journeyLabel;
      document.getElementById("journey-from-label").textContent = L.journeyFrom;
      document.getElementById("journey-to-label").textContent = L.journeyTo;
      document.getElementById("journey-btn").textContent = L.journeyBtn;
    }

    async function loadData() {
      const L = LABELS[lang];
      const city = "Riyadh";

      // Zone status
      try {
        const res  = await fetch(`/public/traffic-status?city=${city}&lang=${lang}`);
        const data = await res.json();
        const grid = document.getElementById("zones-grid");
        grid.innerHTML = "";
        for (const z of data.zones || []) {
          const statusLabel = L.statuses[z.status] || z.status;
          grid.innerHTML += `
            <div class="zone-card status-${z.status}">
              <div class="zone-name">${z.zone}</div>
              <div class="zone-status ${z.status}">${statusLabel}</div>
              <div class="zone-score">${z.congestion_score}</div>
            </div>`;
        }
      } catch (e) {
        document.getElementById("zones-grid").innerHTML =
          `<p class="no-data">Could not load zone data.</p>`;
      }

      // Incidents
      try {
        const res  = await fetch(`/public/incidents?city=${city}&lang=${lang}`);
        const data = await res.json();
        const list = document.getElementById("incidents-list");
        if (!data.incidents || data.incidents.length === 0) {
          list.innerHTML = `<p class="no-data">${L.noIncidents}</p>`;
        } else {
          list.innerHTML = data.incidents.map(i => `
            <div class="incident-row">
              <span>${i.zone}</span>
              <span class="badge badge-${i.severity}">${i.severity}</span>
              <span style="color:var(--muted);font-size:0.8rem">
                ${L.clearance}: ${i.clearance_mins ?? "—"} ${L.mins}
              </span>
            </div>`).join("");
        }
      } catch (e) {
        document.getElementById("incidents-list").innerHTML =
          `<p class="no-data">Could not load incidents.</p>`;
      }

      // ── Parking Guidance ──────────────────────────
      try {
        const res  = await fetch(`/public/parking-guidance?city=${city}&lang=${lang}`);
        const data = await res.json();
        const container = document.getElementById('parking-guidance-portal');
        if (data.total_garages === 0) {
          container.innerHTML = `<p class="no-data">No parking zones with available spaces right now.</p>`;
        } else {
          const top = data.garages.slice(0, 5);
          let html = `<ul style="list-style:none;padding:0;">`;
          top.forEach(g => {
            html += `<li style="background:var(--card);border-radius:0.5rem;padding:0.6rem 1rem;margin-bottom:0.4rem;
                                display:flex;justify-content:space-between;align-items:center;">
              <span>${g.zone}</span>
              <span style="color:var(--green);font-weight:600;">${g.available_spaces} free</span>
              <span style="font-size:0.75rem;color:var(--muted);">${g.forecast_occupancy_pct_1h}% in 1h</span>
            </li>`;
          });
          html += `</ul>`;
          if (data.prayer_warning) {
            html += `<p style="color:var(--red);font-size:0.85rem;">⚠️ ${data.prayer_message}</p>`;
          }
          container.innerHTML = html;
        }
      } catch (e) {
        document.getElementById('parking-guidance-portal').innerHTML =
          `<p class="no-data">Parking information unavailable.</p>`;
      }

      // Travel advisory banner
      try {
        const res  = await fetch(`/public/travel-advisory?city=${city}&lang=${lang}`);
        const data = await res.json();
        const banner = document.getElementById("advisory-banner");
        const text   = document.getElementById("advisory-text");
        if (data.advisories && data.advisories.length > 0) {
          const msg = lang === "ar"
            ? (data.advisories[0].message_ar || data.advisories[0].message)
            : data.advisories[0].message;
          text.textContent = msg;
          banner.classList.add("visible");
        } else {
          banner.classList.remove("visible");
        }
      } catch (e) {
        document.getElementById("advisory-banner").classList.remove("visible");
      }
    }

    // Initial load
    loadData();
    // Auto-refresh every 60 seconds
    setInterval(loadData, 60000);

        // ---- Journey Planner (PROMPT 164) ----
    let lastJourneyParams = null;

    async function loadJourneyPlan() {
      const L = LABELS[lang];
      const city = "Riyadh";
      const fromZone = document.getElementById("journey-from").value;
      const toZone = document.getElementById("journey-to").value;
      const resultBox = document.getElementById("journey-result");

      if (fromZone === toZone) {
        resultBox.innerHTML = `<p class="no-data">Origin and destination must differ.</p>`;
        return;
      }

      lastJourneyParams = { fromZone, toZone };
      resultBox.innerHTML = `<p class="no-data">Loading…</p>`;

      try {
        const res = await fetch(`/public/journey-plan?city=${city}&from_zone=${fromZone}&to_zone=${toZone}&lang=${lang}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        if (!data.legs || data.legs.length === 0) {
          resultBox.innerHTML = `<p class="no-data">${L.journeyNoResult}</p>`;
          return;
        }

        let html = "";
        for (const leg of data.legs) {
          const isRecommended = leg.mode === data.selected_mode;
          const mins = Math.round(leg.estimated_minutes);
          const precisionBadge = leg.precision === "approximate"
            ? `<span class="precision-badge">${L.journeyApprox}</span>`
            : "";
          const modeLabel = leg.mode.replace(/_/g, " ");
          const recommendedTag = isRecommended
            ? `<span style="font-size:0.7rem;color:var(--green);font-weight:600;margin-inline-start:0.5rem;">★ ${L.journeyRecommended}</span>`
            : "";
          const assumption = leg.assumption
            ? `<div class="journey-assumption">${leg.assumption}</div>`
            : "";

          html += `
            <div class="journey-leg ${isRecommended ? 'journey-leg-recommended' : ''}">
              <div style="flex:1;min-width:120px;">
                <div style="font-weight:600;text-transform:capitalize;">${modeLabel}${recommendedTag}</div>
                ${assumption}
              </div>
              <div style="text-align:end;flex-shrink:0;">
                <div style="font-weight:700;">${mins} ${L.journeyMins}</div>
                ${precisionBadge}
              </div>
            </div>`;
        }

        if (data.prayer_window_warning) {
          html += `<p style="color:var(--amber);font-size:0.85rem;margin-top:0.75rem;">⚠ ${L.advisoryTitle}</p>`;
        }

        if (data.precision_summary && data.precision_summary.approximate_legs > 0) {
          html += `<p style="color:var(--muted);font-size:0.75rem;margin-top:0.5rem;">${L.journeyPrecisionNote}</p>`;
        }

        resultBox.innerHTML = html;
      } catch (e) {
        resultBox.innerHTML = `<p class="no-data">${L.journeyError}</p>`;
      }
    }
  </script>
</body>
</html>
